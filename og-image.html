<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="630" fill="#ffffff"/>

    <!-- Subtle grid dots -->
    <defs>
      <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.5" fill="#e8e8e8"/>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#dots)"/>

    <!-- Blue accent block top-left -->
    <rect x="0" y="0" width="8" height="630" fill="#1847d4"/>

    <!-- Large faint "I." watermark -->
    <text x="820" y="560" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-size="520" font-weight="800" fill="#f0f0f0" letter-spacing="-20">I.</text>

    <!-- Name -->
    <text x="72" y="230" font-family="'Bricolage Grotesque', Arial Black, sans-serif" font-size="110" font-weight="800" fill="#111111" letter-spacing="-4">Isak Powell</text>

    <!-- Blue dot on Isak -->
    <circle cx="60" cy="200" r="0" fill="#1847d4"/>

    <!-- Divider line -->
    <line x1="72" y1="260" x2="580" y2="260" stroke="#e0e0e0" stroke-width="1.5"/>

    <!-- Role -->
    <text x="72" y="330" font-family="'Instrument Serif', Georgia, serif" font-size="42" font-weight="400" fill="#444444" font-style="italic">Product Designer &amp; Developer</text>

    <!-- Location pill -->
    <rect x="72" y="370" width="190" height="44" rx="22" fill="#111111"/>
    <text x="167" y="398" font-family="'Inter', Arial, sans-serif" font-size="17" font-weight="500" fill="#ffffff" text-anchor="middle">Australia</text>

    <!-- Skills row -->
    <text x="72" y="490" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="400" fill="#888888" letter-spacing="0.5">UX/UI  ·  Figma  ·  Next.js  ·  Branding  ·  Web Development</text>

    <!-- URL -->
    <text x="72" y="570" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="400" fill="#1847d4">isak.com.au</text>

    <!-- Blue accent dot -->
    <circle cx="1140" cy="570" r="28" fill="#1847d4" opacity="0.12"/>
    <circle cx="1140" cy="570" r="16" fill="#1847d4" opacity="0.2"/>
    <circle cx="1140" cy="570" r="8" fill="#1847d4"/>
  </svg>
</body>
</html>
