<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Isak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(to bottom, transparent 30vh, #ffffff 60vh),
        radial-gradient(ellipse at 50% 0%, rgba(206, 255, 195, 0.10) 0%, #ffffff 100%) top / 100% 60vh no-repeat;
      background-color: #ffffff;
    }

    /* ── Shared layout ── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Navbar ── */
    nav {
      padding-top: 24px;
    }

    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 22px;
      padding-bottom: 22px;
    }

    .nav-logo {
      height: 24px;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
    }

    .nav-links a:hover { opacity: 0.6; }

    .nav-btn {
      background: #1847d4;
      color: #fff !important;
      padding: 10px 22px;
      border-radius: 100px;
    }

    .nav-btn:hover { opacity: 0.85 !important; }

    /* ── Page content ── */
    .page-content {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Page header ── */
    .photo-header {
      padding-top: 60px;
      padding-bottom: 28px;
    }

    .photo-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: #111;
      margin-bottom: 14px;
    }

    .photo-subtitle {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #000000;
      font-weight: 400;
    }

    /* ── Photo grid ── */
    .photo-grid {
      display: flex;
      gap: 16px;
      padding-bottom: 80px;
    }

    .photo-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
    }

    .photo-col-left  { flex: 1.35; }
    .photo-col-right { flex: 1; }

    /* ── Photo card (placeholder) ── */
    .photo-card {
      background: #d4d0ca;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    /* placeholder insert helper */
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Heights — left column */
    .pc-l1 { height: 62vh; }
    .pc-l2 { height: 34vh; }
    .pc-l3 { height: 50vh; }

    /* Heights — right column */
    .pc-r1 { height: 48vh; }
    .pc-r2 { height: 38vh; }
    .pc-r3 { height: 60vh; }

    /* ── Footer ── */
    .footer {
      padding: 80px 40px 60px;
      text-align: center;
    }

    .footer-text {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 7.2vw, 140px);
      font-weight: 400;
      color: #111;
      line-height: 1.1;
    }

    .footer-text .eyes {
      color: #1847d4;
      font-style: italic;
    }

    .footer-links {
      display: flex;
      justify-content: flex-start;
      gap: 40px;
      margin-top: 32px;
      padding-bottom: 40px;
    }

    .footer-links a {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #111;
      text-decoration: none;
    }

    .footer-links a:hover { opacity: 0.6; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="container">
      <a href="index.html"><img src="logo.png" alt="Isak." class="nav-logo"></a>
      <ul class="nav-links">
        <li><a href="index.html">Work</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="https://www.linkedin.com/in/isak-powell/" target="_blank">LinkedIn ↗</a></li>
        <li><a href="#" class="nav-btn">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page header -->
  <div class="page-content">
    <div class="photo-header">
      <h1 class="photo-title">Photography</h1>
      <p class="photo-subtitle">Since the age of 8 all I wanted for Christmas was a camera. The rest is history.</p>
    </div>

    <!-- Photo grid -->
    <div class="photo-grid">

      <!-- Left column -->
      <div class="photo-col photo-col-left">
        <div class="photo-card pc-l1">
          <img src="photography\IMG_3894-2.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-l2">
          <img src="photography\IMG_4272-2.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-l3">
          <img src="photography/IMG_4856.jpg" alt="Photography by Isak">
        </div>
      </div>

      <!-- Right column -->
      <div class="photo-col photo-col-right">
        <div class="photo-card pc-r1">
          <img src="photography\IMG_5038.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-r2">
          <img src="photography/IMG_4739.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-r3">
          <img src="photography/IMG_5012.jpg" alt="Photography by Isak">
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="footer page-content">
    <div style="height:1.5px;margin-bottom:60px;background-image:repeating-linear-gradient(to right,#111 0px,#111 24px,transparent 24px,transparent 36px);"></div>
    <p class="footer-text">Build a world your <span class="eyes">eyes</span> deserve</p>
    <div class="footer-links">
      <a href="index.html">Work</a>
      <a href="photography.html">Photography</a>
      <a href="#">LinkedIn</a>
      <a href="#">Contact</a>
    </div>
  </footer>

</body>
</html>
