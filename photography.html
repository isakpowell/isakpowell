<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favi.svg" type="image/svg+xml">
  <title>Photography — Isak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(to bottom, transparent 60vh, #ffffff 110vh),
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180, 255, 160, 0.55) 0%, rgba(210, 255, 195, 0.25) 50%, #ffffff 100%) top / 100% 130vh no-repeat;
      background-color: #ffffff;
    }

    @media (hover: hover) and (pointer: fine) {
      body { cursor: none; }

      *, a, button, input, [role="button"] { cursor: none; }

      #cursor {
        position: fixed;
        width: 22px;
        height: 22px;
        background: rgba(0,0,0,0.75);
        border-radius: 50%;
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        transition: width 0.15s ease, height 0.15s ease;
      }

      body:has(a:hover) #cursor,
      body:has(button:hover) #cursor {
        width: 38px;
        height: 38px;
      }
    }

    @media (pointer: coarse), (max-width: 1024px) {
      #cursor { display: none !important; }
      body, *, a, button, input, [role="button"] { cursor: auto !important; }
    }

    /* ── Shared layout ── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }


    /* ── Page content ── */
    .page-content {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Page header ── */
    .photo-header {
      padding-top: 120px;
      padding-bottom: 28px;
    }

    .photo-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: #111;
      margin-bottom: 14px;
    }

    .photo-subtitle {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #000000;
      font-weight: 400;
    }

    /* ── Photo grid ── */
    .photo-grid {
      display: flex;
      gap: 16px;
      padding-bottom: 80px;
    }

    .photo-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
    }

    .photo-col-left  { flex: 1.35; }
    .photo-col-right { flex: 1; }

    /* ── Photo card (placeholder) ── */
    .photo-card {
      background: #d4d0ca;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    /* placeholder insert helper */
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Heights — left column */
    .pc-l1 { height: 62vh; }
    .pc-l2 { height: 34vh; }
    .pc-l3 { height: 50vh; }

    /* Heights — right column */
    .pc-r1 { height: 48vh; }
    .pc-r2 { height: 38vh; }
    .pc-r3 { height: 60vh; }

    /* ── Footer ── */
    .footer {
      padding: 80px 40px 60px;
      text-align: center;
    }

    .footer-text {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 7.2vw, 140px);
      font-weight: 400;
      color: #111;
      line-height: 1.1;
    }

    .footer-text .eyes {
      color: #1847d4;
      font-style: italic;
    }

    .footer-links {
      display: flex;
      justify-content: flex-start;
      gap: 40px;
      margin-top: 32px;
      padding-bottom: 40px;
    }

    .footer-links a {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #111;
      text-decoration: none;
    }

    .footer-links a:hover { opacity: 0.6; }

    @media (max-width: 768px) {
      .container,
      .page-content { padding: 0 40px; }

.photo-header { padding-top: 100px; padding-bottom: 20px; }
      .photo-title { font-size: 40px; letter-spacing: -1px; }
      .photo-subtitle { font-size: 16px; }

      .photo-grid { flex-direction: column; }
      .photo-col-left,
      .photo-col-right { flex: none; }
      .pc-l1, .pc-l2, .pc-l3,
      .pc-r1, .pc-r2, .pc-r3 { height: 72vw; }

      .footer { padding: 60px 20px 40px; }
      .footer-links { gap: 24px; flex-wrap: wrap; }
      .footer-links a { font-size: 16px; }
    }
  </style>
  <script>tailwind.config={corePlugins:{preflight:false},theme:{extend:{fontFamily:{bricolage:['Bricolage Grotesque','sans-serif'],instrument:['Instrument Serif','serif'],inter:['Inter','sans-serif']}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .nav-hamburger{display:none;flex-direction:column;align-items:flex-start;justify-content:center;background:transparent;border:none;padding:4px;cursor:pointer;}
    .nav-hamburger span{display:block!important;height:2px!important;background:#111;border-radius:2px!important;transition:transform 280ms ease,opacity 200ms ease!important;}
    .nav-hamburger span:nth-child(1){width:13px!important;margin-bottom:6px!important;}
    .nav-hamburger span:nth-child(2){width:20px!important;margin-bottom:6px!important;}
    .nav-hamburger span:nth-child(3){width:26px!important;}
    .nav-hamburger.open span{background:#fff!important;}
    .nav-hamburger.open span:nth-child(1){width:26px!important;transform:translateY(8px) rotate(45deg)!important;}
    .nav-hamburger.open span:nth-child(2){width:26px!important;opacity:0!important;}
    .nav-hamburger.open span:nth-child(3){width:26px!important;transform:translateY(-8px) rotate(-45deg)!important;}
    #pill-nav.overlay-open{background:transparent!important;backdrop-filter:none!important;box-shadow:none!important;border-radius:0!important;}
    .nav-logo{font-family:'Bricolage Grotesque',sans-serif!important;font-weight:800!important;font-size:32px!important;letter-spacing:-0.7px!important;text-decoration:none!important;color:#000!important;line-height:1!important;}
    #pill-nav.overlay-open .nav-logo{color:#fff!important;}
    .nav-overlay{display:flex!important;position:fixed!important;inset:0!important;background:#000!important;z-index:1000!important;flex-direction:column!important;padding:0 40px!important;visibility:hidden;clip-path:circle(0px at calc(100% - 80px) 55px);transition:clip-path 0.42s cubic-bezier(0.77,0,0.175,1),visibility 0s linear 0.42s;}
    .nav-overlay.open{visibility:visible!important;clip-path:circle(150% at calc(100% - 80px) 55px)!important;transition:clip-path 0.42s cubic-bezier(0.77,0,0.175,1),visibility 0s linear 0s;}
    .nav-overlay-primary{list-style:none!important;margin:110px 0 0!important;padding:0!important;display:flex!important;flex-direction:column!important;}
    .nav-overlay-primary li a{display:block!important;font-family:'Bricolage Grotesque',sans-serif!important;font-size:clamp(48px,14vw,64px)!important;font-weight:800!important;color:#fff!important;text-decoration:none!important;letter-spacing:-2px!important;line-height:1.15!important;padding:4px 0!important;opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease;}
    .nav-overlay.open .nav-overlay-primary li:nth-child(1) a{opacity:1!important;transform:none!important;transition-delay:.18s;}
    .nav-overlay.open .nav-overlay-primary li:nth-child(2) a{opacity:1!important;transform:none!important;transition-delay:.24s;}
    .nav-overlay.open .nav-overlay-primary li:nth-child(3) a{opacity:1!important;transform:none!important;transition-delay:.30s;}
    .nav-overlay-secondary{list-style:none!important;margin:32px 0 0!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:10px!important;}
    .nav-overlay-secondary li a{display:block!important;font-family:'Instrument Serif',serif!important;font-size:20px!important;color:rgba(255,255,255,0.38)!important;text-decoration:none!important;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease;}
    .nav-overlay.open .nav-overlay-secondary li:nth-child(1) a{opacity:1!important;transform:none!important;transition-delay:.34s;}
    .nav-overlay.open .nav-overlay-secondary li:nth-child(2) a{opacity:1!important;transform:none!important;transition-delay:.38s;}
    @media(max-width:768px){.nav-hamburger{display:flex!important;}.nav-links-pill{display:none!important;}}
  </style>
</head>

  <script>
    const hamburger = document.getElementById('nav-hamburger');
    const overlay   = document.getElementById('nav-overlay');
    const pillNav   = document.getElementById('pill-nav');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      overlay.classList.toggle('open');
      pillNav.classList.toggle('overlay-open');
      document.body.style.overflow = overlay.classList.contains('open') ? 'hidden' : '';
    });
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
    } else {
      const cursor = document.getElementById('cursor');
      if (cursor) cursor.style.display = 'none';
    }
  </script>
