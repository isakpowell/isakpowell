<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favi.svg" type="image/svg+xml">
  <title>Photography — Isak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(to bottom, transparent 30vh, #ffffff 60vh),
        radial-gradient(ellipse at 50% 0%, rgba(206, 255, 195, 0.10) 0%, #ffffff 100%) top / 100% 60vh no-repeat;
      background-color: #ffffff;
    }

    @media (hover: hover) and (pointer: fine) {
      body { cursor: none; }

      *, a, button, input, [role="button"] { cursor: none; }

      #cursor {
        position: fixed;
        width: 22px;
        height: 22px;
        background: rgba(0,0,0,0.75);
        border-radius: 50%;
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        transition: width 0.15s ease, height 0.15s ease;
      }

      body:has(a:hover) #cursor,
      body:has(button:hover) #cursor {
        width: 38px;
        height: 38px;
      }
    }

    @media (pointer: coarse), (max-width: 1024px) {
      #cursor { display: none !important; }
      body, *, a, button, input, [role="button"] { cursor: auto !important; }
    }

    /* ── Shared layout ── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Navbar ── */
    nav {
      padding-top: 24px;
    }

    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 22px;
      padding-bottom: 22px;
    }

    .nav-logo {
      height: 120px;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
    }

    .nav-links a:hover { opacity: 0.6; }

    .nav-btn {
      background: #1847d4;
      color: #fff !important;
      padding: 10px 22px;
      border-radius: 100px;
    }

    .nav-btn:hover { opacity: 0.85 !important; }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      position: relative;
      z-index: 1001;
    }
    .nav-hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #111;
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open {
      display: flex;
      opacity: 1;
    }
    .nav-overlay ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .nav-overlay ul li {
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .nav-overlay ul li:first-child {
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    .nav-overlay ul li a {
      display: block;
      padding: 22px 0;
      text-decoration: none;
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
    }
    .nav-overlay ul li a:active { opacity: 0.5; }

    /* ── Page content ── */
    .page-content {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Page header ── */
    .photo-header {
      padding-top: 60px;
      padding-bottom: 28px;
    }

    .photo-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: #111;
      margin-bottom: 14px;
    }

    .photo-subtitle {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #000000;
      font-weight: 400;
    }

    /* ── Photo grid ── */
    .photo-grid {
      display: flex;
      gap: 16px;
      padding-bottom: 80px;
    }

    .photo-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
    }

    .photo-col-left  { flex: 1.35; }
    .photo-col-right { flex: 1; }

    /* ── Photo card (placeholder) ── */
    .photo-card {
      background: #d4d0ca;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    /* placeholder insert helper */
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Heights — left column */
    .pc-l1 { height: 62vh; }
    .pc-l2 { height: 34vh; }
    .pc-l3 { height: 50vh; }

    /* Heights — right column */
    .pc-r1 { height: 48vh; }
    .pc-r2 { height: 38vh; }
    .pc-r3 { height: 60vh; }

    /* ── Footer ── */
    .footer {
      padding: 80px 40px 60px;
      text-align: center;
    }

    .footer-text {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 7.2vw, 140px);
      font-weight: 400;
      color: #111;
      line-height: 1.1;
    }

    .footer-text .eyes {
      color: #1847d4;
      font-style: italic;
    }

    .footer-links {
      display: flex;
      justify-content: flex-start;
      gap: 40px;
      margin-top: 32px;
      padding-bottom: 40px;
    }

    .footer-links a {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: #111;
      text-decoration: none;
    }

    .footer-links a:hover { opacity: 0.6; }

    @media (max-width: 768px) {
      .container,
      .page-content { padding: 0 20px; }

      nav { padding-top: 8px; position: relative; }
      .nav-hamburger { display: flex; }
      .nav-links { display: none; }

      .photo-header { padding-top: 32px; padding-bottom: 20px; }
      .photo-title { font-size: clamp(44px, 13vw, 80px); letter-spacing: -1px; }
      .photo-subtitle { font-size: 16px; }

      .photo-grid { flex-direction: column; }
      .photo-col-left,
      .photo-col-right { flex: none; }
      .pc-l1, .pc-l2, .pc-l3,
      .pc-r1, .pc-r2, .pc-r3 { height: 72vw; }

      .footer { padding: 60px 20px 40px; }
      .footer-links { gap: 24px; flex-wrap: wrap; }
      .footer-links a { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div id="cursor"></div>

  <!-- Navbar -->
  <nav>
    <div class="container">
      <a href="index.html"><img src="blinking_isak_logo.gif" alt="Isak." class="nav-logo"></a>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Work</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="https://www.linkedin.com/in/isak-powell/" target="_blank">LinkedIn ↗</a></li>
      </ul>
    </div>
  </nav>

  <!-- Mobile full-page nav overlay -->
  <div class="nav-overlay" id="nav-overlay">
    <ul>
      <li><a href="index.html">Work</a></li>
      <li><a href="photography.html">Photography</a></li>
      <li><a href="https://www.linkedin.com/in/isak-powell/" target="_blank">LinkedIn ↗</a></li>
    </ul>
  </div>

  <!-- Page header -->
  <div class="page-content">
    <div class="photo-header">
      <h1 class="photo-title">Photography</h1>
      <p class="photo-subtitle">Since the age of 8 all I wanted for Christmas was a camera. The rest is history.</p>
    </div>

    <!-- Photo grid -->
    <div class="photo-grid">

      <!-- Left column -->
      <div class="photo-col photo-col-left">
        <div class="photo-card pc-l1">
          <img src="photography\IMG_3894-2.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-l2">
          <img src="photography\IMG_4272-2.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-l3">
          <img src="photography/IMG_4856.jpg" alt="Photography by Isak">
        </div>
      </div>

      <!-- Right column -->
      <div class="photo-col photo-col-right">
        <div class="photo-card pc-r1">
          <img src="photography\IMG_5038.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-r2">
          <img src="photography/IMG_4739.jpg" alt="Photography by Isak">
        </div>
        <div class="photo-card pc-r3">
          <img src="photography/IMG_5012.jpg" alt="Photography by Isak">
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="footer page-content">
    <div style="height:1.5px;margin-bottom:60px;background-image:repeating-linear-gradient(to right,#111 0px,#111 24px,transparent 24px,transparent 36px);"></div>
    <p class="footer-text">Build a world your <span class="eyes">eyes</span> deserve</p>
    <div class="footer-links">
      <a href="index.html">Work</a>
      <a href="photography.html">Photography</a>
      <a href="#">LinkedIn</a>
      <a href="#">Contact</a>
    </div>
  </footer>

  <script>
    const hamburger = document.getElementById('nav-hamburger');
    const overlay = document.getElementById('nav-overlay');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      overlay.classList.toggle('open');
      document.body.style.overflow = overlay.classList.contains('open') ? 'hidden' : '';
    });
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
    } else {
      const cursor = document.getElementById('cursor');
      if (cursor) cursor.style.display = 'none';
    }
  </script>
</body>
</html>
